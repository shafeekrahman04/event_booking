<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Events — EventX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #fff;
      --text: #0f172a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --shadow: 0 12px 32px rgba(2, 8, 23, .06);
      --radius: 14px;
      --pend: #f59e0b;
      --appr: #16a34a;
      --publ: #2563eb;
      --rej: #ef4444;
      --arch: #6b7280;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: 900
    }

    .container {
      max-width: 1100px;
      margin: 22px auto;
      padding: 0 16px
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .input {
      flex: 1;
      min-width: 260px;
      position: relative
    }

    .input i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8
    }

    .input input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none
    }

    .input input:focus {
      box-shadow: 0 0 0 6px rgba(14, 165, 233, .15)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer
    }

    .btn--ghost {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--border)
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .tab {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: #111827
    }

    .tab.active {
      background: #111827;
      color: #fff
    }

    .statbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 16px
    }

    .stat {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: var(--shadow)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    @media(max-width:1000px) {
      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:640px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .thumb {
      position: relative
    }

    .thumb img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block
    }

    .badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(17, 24, 39, .85);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px
    }

    .inner {
      padding: 14px
    }

    .title {
      font-weight: 900;
      margin: 0 0 4px
    }

    .meta {
      color: var(--muted);
      font-size: 13px
    }

    .prices {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .pill {
      display: inline-flex;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px
    }

    .s-PENDING {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a
    }

    .s-APPROVED {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac
    }

    .s-PUBLISHED {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd
    }

    .s-REJECTED {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca
    }

    .s-ARCHIVED {
      background: #e5e7eb;
      color: #374151;
      border: 1px solid #cbd5e1
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .empty {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: var(--muted)
    }

    a.link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700
    }
  </style>
</head>

<body>
  <header style="display:flex;justify-content:space-between;align-items:center;">
    <div style="font-weight:900;">My Events</div>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button type="submit" class="btn btn--ghost">
        <i class="ri-logout-box-r-line"></i> Logout
      </button>
    </form>

  </header>
  <div class="container">
    <div class="toolbar">
      <div class="input"><i class="ri-search-line"></i><input id="search" placeholder="Search by title or venue…" />
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-f="ALL">All</button>
      <button class="tab" data-f="PENDING">Pending</button>
      <button class="tab" data-f="APPROVED">Approved</button>
      <button class="tab" data-f="PUBLISHED">Published</button>
      <button class="tab" data-f="REJECTED">Rejected</button>
      <button class="tab" data-f="ARCHIVED">Archived</button>
    </div>

    <div class="statbar">
      <div class="stat">Total: <span id="statTotal">0</span></div>
      <div class="stat">Pending: <span id="statPending">0</span></div>
      <div class="stat">Approved: <span id="statApproved">0</span></div>
      <div class="stat">Published: <span id="statPublished">0</span></div>
    </div>

    <div id="list" class="grid"></div>
    <div id="empty" class="empty" style="display:none">No events added yet.</div>
  </div>

  <script>
    // -------- API CONFIG --------
    const API_BASE = "/api/events";

    async function apiGetAll() {
      const res = await fetch(API_BASE);
      return res.json();
    }

    async function apiUpdate(id, payload) {
      const res = await fetch(`${API_BASE}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function apiDelete(id) {
      await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
    }

    async function apiDuplicate(id) {
      const res = await fetch(`${API_BASE}/${id}/duplicate`, { method: "POST" });
      return res.json();
    }

    // -------- UI state --------
    let allEvents = [];
    let currentFilter = "ALL";
    const tabs = document.getElementById("tabs");
    const search = document.getElementById("search");

    // -------- event actions --------
    async function approveEvent(id) {
      await fetch(`${API_BASE}/${id}/approve`, { method: "POST" });
      alert("Event approved.");
      loadEvents();
    }

    async function rejectEvent(id) {
      const reason = prompt("Enter rejection reason:") || "";
      await fetch(`${API_BASE}/${id}/reject`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(reason)
      });
      alert("Event rejected.");
      loadEvents();
    }

    async function publishEvent(id) {
      await fetch(`${API_BASE}/${id}/publish`, { method: "POST" });
      alert("Event published.");
      loadEvents();
    }

    async function unpublishEvent(id) {
      await fetch(`${API_BASE}/${id}/unpublish`, { method: "POST" });
      alert("Event unpublished.");
      loadEvents();
    }

    async function archiveEvent(id) {
      await fetch(`${API_BASE}/${id}/archive`, { method: "POST" });
      alert("Event archived.");
      loadEvents();
    }

    async function duplicateEvent(id) {
      await fetch(`${API_BASE}/${id}/duplicate`, { method: "POST" });
      alert("Event duplicated.");
      loadEvents();
    }

    async function deleteEvent(id) {
      if (!confirm("Delete this event? This cannot be undone.")) return;
      await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
      alert("Event deleted.");
      loadEvents();
    }


    // -------- render helpers --------
    function statusBadge(status) {
      const s = (status || "DRAFT").toUpperCase();
      return `<span class="status s-${s}">${s}</span>`;
    }

    function actionsFor(ev) {
      const s = (ev.status || "DRAFT").toUpperCase();
      switch (s) {
        case "DRAFT":
          return `<button class="btn btn--ghost" onclick='editEvent("${ev.id}")'><i class="ri-edit-2-line"></i> Edit</button>`;
        case "PENDING":
          return `
            <button class="btn" onclick='approveEvent("${ev.id}")'><i class="ri-check-line"></i> Approve</button>
            <button class="btn btn--ghost" onclick='rejectEvent("${ev.id}")'><i class="ri-close-line"></i> Reject</button>
            <button class="btn btn--ghost" onclick='editEvent("${ev.id}")'><i class="ri-edit-2-line"></i> Edit</button>
          `;
        case "APPROVED":
          return `
            <button class="btn" onclick='publishEvent("${ev.id}")'><i class="ri-upload-2-line"></i> Publish</button>
            <button class="btn btn--ghost" onclick='rejectEvent("${ev.id}")'><i class="ri-close-line"></i> Reject</button>
            <button class="btn btn--ghost" onclick='editEvent("${ev.id}")'><i class="ri-edit-2-line"></i> Edit</button>
          `;
        case "PUBLISHED":
          return `
            <button class="btn btn--ghost" onclick='unpublishEvent("${ev.id}")'><i class="ri-eye-off-line"></i> Unpublish</button>
            <button class="btn btn--ghost" onclick='archiveEvent("${ev.id}")'><i class="ri-archive-line"></i> Archive</button>
          `;
        case "REJECTED":
          return `<button class="btn btn--ghost" onclick='editEvent("${ev.id}")'><i class="ri-edit-2-line"></i> Edit & Resubmit</button>`;
        case "ARCHIVED":
          return `<button class="btn btn--ghost" onclick='duplicateEvent("${ev.id}")'><i class="ri-file-copy-line"></i> Duplicate</button>`;
        default:
          return `<span class="muted">${s}</span>`;
      }
    }
    function formatDate(dt) {
      if (!dt) return "—";
      const d = new Date(dt);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0'); // months are 0-indexed
      const year = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    // Usage

    function card(ev) {
      const vip = ev.priceVIP ?? 0;
      const prem = ev.pricePremium ?? 0;
      const norm = ev.priceNormal ?? 0;
      const dateText = formatDate(ev.dateTime);
      const rej = ev.rejectionReason ? `<div class="meta">Reason: ${ev.rejectionReason}</div>` : "";
      return `
        <article class="card">
          <div class="thumb">
            <img src="${ev.image}" alt="${ev.title}">
            <div class="badge">★ ${ev.rating ?? "—"}</div>
          </div>
          <div class="inner">
            <div class="title">${ev.title}</div>
            <div class="meta">${dateText} • ${ev.location || "—"}</div>
            <div style="margin-top:6px">${statusBadge(ev.status)}</div>
            ${rej}
            <div class="prices">
              <span class="pill">VIP ₹${vip}</span>
              <span class="pill">Premium ₹${prem}</span>
              <span class="pill">Normal ₹${norm}</span>
            </div>
            <div class="actions">
              ${actionsFor(ev)}
              <button class="btn btn--ghost" onclick='duplicateEvent("${ev.id}")'><i class="ri-file-copy-line"></i> Duplicate</button>
              <button class="btn btn--ghost" onclick='deleteEvent("${ev.id}")'><i class="ri-delete-bin-6-line"></i> Delete</button>
            </div>
          </div>
        </article>
      `;
    }

    // -------- render main --------
    function render() {
      const listEl = document.getElementById("list");
      const emptyEl = document.getElementById("empty");
      const statTotal = document.getElementById("statTotal");
      const statPending = document.getElementById("statPending");
      const statApproved = document.getElementById("statApproved");
      const statPublished = document.getElementById("statPublished");

      const term = (search.value || "").toLowerCase();
      let filtered = allEvents.filter(e =>
        (!term || (e.title || "").toLowerCase().includes(term) || (e.location || "").toLowerCase().includes(term))
      );
      if (currentFilter !== "ALL") {
        filtered = filtered.filter(e => (e.status || "DRAFT").toUpperCase() === currentFilter);
      }

      statTotal.textContent = allEvents.length;
      statPending.textContent = allEvents.filter(e => e.status === "PENDING").length;
      statApproved.textContent = allEvents.filter(e => e.status === "APPROVED").length;
      statPublished.textContent = allEvents.filter(e => e.status === "PUBLISHED").length;

      if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyEl.style.display = "block";
      } else {
        emptyEl.style.display = "none";
        listEl.innerHTML = filtered.map(card).join("");
      }
    }

    // -------- load events --------
    async function loadEvents() {
      allEvents = await apiGetAll();
      render();
    }

    // -------- navigation --------
    function editEvent(id) {
      localStorage.setItem("adminEditEventId", id);
      location.href = "organizer.html"; // redirect to organizer edit form
    }

    // -------- init --------
    tabs.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        currentFilter = t.dataset.f;
        render();
      });
    });
    search.addEventListener("input", render);

    loadEvents();
  </script>
</body>

</html>
