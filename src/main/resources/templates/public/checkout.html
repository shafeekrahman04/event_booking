<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — EventX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #111827
    }

    header {
      background: #111827;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: 800
    }

    .container {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(2, 8, 23, .06)
    }

    .inner {
      padding: 18px
    }

    label {
      display: block;
      font-size: 14px;
      color: #475569;
      margin: 10px 0 6px
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      outline: none
    }

    input:focus {
      box-shadow: 0 0 0 6px rgba(14, 165, 233, .18)
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer
    }

    .btn:hover {
      filter: brightness(1.05)
    }

    .btn--ghost {
      background: #fff;
      color: #111827;
      border: 1px solid #e5e7eb
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0
    }

    .muted {
      color: #6b7280
    }

    .total {
      font-weight: 900;
      font-size: 18px
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid #e2e8f0
    }

    .event-mini {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .event-mini img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px
    }

    @media(max-width:600px) {
      .grid {
        grid-template-columns: 1fr
      }

      .event-mini {
        flex-direction: column;
        align-items: flex-start
      }
    }
  </style>
</head>

<body>
  <header>Checkout</header>

  <div class="container">
    <div class="grid">
      <!-- Payment form -->
      <div class="card">
        <div class="inner">
          <div id="timer" class="muted" style="font-weight:800;color:#ef4444;margin-bottom:8px">⏳ Complete payment in
            10:00</div>

          <h2>Payment details</h2>
          <div class="row">
            <div>
              <label>Full name</label>
              <input id="name" placeholder="Priya Sharma" />
            </div>
            <div>
              <label>Email</label>
              <input id="email" placeholder="priya@example.com" />
            </div>
          </div>

          <label>Card number</label>
          <input id="card" placeholder="1234 5678 9012 3456" />

          <div class="row">
            <div>
              <label>Expiry</label>
              <input id="exp" placeholder="MM/YY" />
            </div>
            <div>
              <label>CVV</label>
              <input id="cvv" type="password" placeholder="***" />
            </div>
          </div>

          <label>Promo Code</label>
          <div style="display:flex;gap:8px">
            <input id="promo" placeholder="Enter code (try EVENT10)" style="flex:1" />
            <button type="button" class="btn btn--ghost" onclick="applyPromo()">Apply</button>
          </div>
          <p id="promoMsg" class="muted" style="font-size:13px;margin-top:6px"></p>

          <button type="button" class="btn" style="margin-top:14px" onclick="payNow()">
            <i class="ri-lock-2-line"></i> Pay <span id="payTotal"
              th:text="'₹' + (${totalPrice} + (${totalPrice} * 0.05))">₹0</span>
          </button>
          <p class="muted" style="margin-top:8px;font-size:12px">
            <i class="ri-shield-check-line"></i> Secure checkout • Your card will not be charged (demo)
          </p>
        </div>
      </div>

      <!-- Order summary -->
      <div class="card">
        <div class="inner">
          <div class="event-mini">
            <img th:src="@{${event.image}}" alt="Event" />
            <div>
              <div style="font-weight:800" th:text="${event.title}">Live Concert 2025</div>
              <div class="muted" th:text="${event.dateTime} + ' • ' + ${event.location}">Sept 12 • City Auditorium</div>
            </div>
          </div>

          <div style="margin-top:16px">
            <div class="summary-row"><span class="muted">Seats</span>
              <span th:text="${#strings.arrayJoin(seats, ', ')}">—</span>
            </div>
            <div class="summary-row"><span class="muted">Subtotal</span>
              <span th:text="'₹' + ${totalPrice}">₹0</span>
            </div>
            <div class="summary-row"><span class="muted">Convenience fee</span>
              <span th:text="'₹' + (${totalPrice} * 0.05)">₹0</span>
            </div>
            <div class="summary-row"><span class="muted">Discount</span>
              <span id="sumDisc">- ₹0</span>
            </div>
            <div class="summary-row total"><span>Total</span>
              <span id="sumTotal" th:text="'₹' + (${totalPrice} + (${totalPrice} * 0.05))">₹0</span>
            </div>
          </div>

          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
            <span class="tag"><i class="ri-qr-code-line"></i> Instant QR ticket</span>
            <span class="tag"><i class="ri-refresh-line"></i> 24h easy cancellation</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script th:inline="javascript">
    /*<![CDATA[*/
    let timeLeft = 600;
    const timerEl = document.getElementById("timer");
    const timer = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(timer);
        alert("⏳ Time expired! Seats released.");
        location.href = "event.html";
        return;
      }
      const m = Math.floor(timeLeft / 60);
      const s = (timeLeft % 60).toString().padStart(2, "0");
      timerEl.textContent = `⏳ Complete payment in ${m}:${s}`;
      timeLeft--;
    }, 1000);

    const subTotal = /*[[${totalPrice}]]*/ 0; // server-side injected
    let discount = 0;

    function formatINR(n) { return "₹" + n; }

    function updateTotals() {
      const fee = Math.round(subTotal * 0.05);
      const total = Math.max(0, subTotal + fee - discount);

      document.getElementById("sumDisc").textContent = "- " + formatINR(discount);
      document.getElementById("sumTotal").textContent = formatINR(total);
      document.getElementById("payTotal").textContent = formatINR(total);
    }

    function applyPromo() {
      const code = (document.getElementById("promo").value || "").trim().toUpperCase();
      if (code === "EVENT10") {
        discount = Math.round(subTotal * 0.10);
        document.getElementById("promoMsg").textContent = "🎉 Promo applied: - " + formatINR(discount);
      } else {
        discount = 0;
        document.getElementById("promoMsg").textContent = "❌ Invalid code";
      }
      updateTotals();
    }

    function payNow() {
      const eventId = /*[[${event.id}]]*/ 0;

      const payload = {
        eventId: eventId,
        seats: /*[[${seats}]]*/[],      // array of seat strings
        totalPrice: Math.max(0, subTotal + Math.round(subTotal * 0.05) - discount),
        customerName: document.getElementById("name").value,
        customerEmail: document.getElementById("email").value
      };

      fetch('/api/confirmBooking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(res => {
          if (!res.ok) throw new Error("Network error: " + res.status);
          return res.json();
        })
        .then(data => {
          if (data.id) {
            window.location.href = `/v1/book-confirm/${data.id}`;
          } else {
            alert("Booking failed! Please try again.");
          }
        })
        .catch(err => console.error("Error:", err));

    }

    updateTotals();
    /*]]>*/
  </script>

</body>

</html>
